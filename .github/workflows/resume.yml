name: Resume server (EC2 start)

on:
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-2
  INSTANCE_ID: i-04614c2e6142ebe00

jobs:
  resume:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Start instance
        run: |
          aws ec2 start-instances --instance-ids "$INSTANCE_ID"
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"

      # 부팅 시 DuckDNS 갱신 + 최신 이미지 pull + 기동은 EC2 내부 서비스가 처리
      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            code=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 10 https://gaemizip.duckdns.org/ 2>curl_err.txt || true)
            echo "attempt $i: $code $(cat curl_err.txt)"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "health check timed out" >&2
          exit 1
