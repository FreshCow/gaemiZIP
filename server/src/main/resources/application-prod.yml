spring:
  datasource:
    # Neon 등 SSL 필수인 관리형 Postgres 대응 (AWS RDS도 sslmode=require 수용 가능)
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # TODO: Flyway 도입 후 validate로 전환 (ddl-auto 자동 변경으로 인한 스키마 드리프트 방지)
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # FREE_DEPLOY_TEMP(단, 플랫폼 무관하게 유지 권장): Upstash 등 TLS+비밀번호 필요한 Redis 대응, 기본값은 무해(로컬 Redis는 영향 없음)
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

server:
  # FREE_DEPLOY_TEMP(단, 플랫폼 무관하게 유지 권장): Render가 주입하는 PORT 환경변수 바인딩, 기본값 8080은 그대로
  port: ${PORT:8080}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

gemini:
  api:
    key: ${GEMINI_API_KEY}

kiwoom:
  api:
    app-key: ${KIWOOM_APP_KEY}
    app-secret: ${KIWOOM_APP_SECRET}

naver:
  api:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}

jwt:
  secret: ${JWT_SECRET}

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID}

moderation.service.url: ${MODERATION_SERVICE_URL}
