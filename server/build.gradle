plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'sw'
version = '0.0.1-SNAPSHOT'
description = 'ScalperAgent'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'com.google.api-client:google-api-client:2.2.0'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    // JSON 파싱용 Jackson 라이브러리 추가
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform {
        // 벤치마크/동시성 재현 테스트는 실제 RDS에 데이터를 만들고 시간이 걸려 기본 test에서 제외
        excludeTags 'benchmark', 'concurrency'
    }
}

// 예약 체결 처리량 벤치마크(순차 vs 병렬) 전용 태스크 — ./gradlew benchmarkTest
tasks.register('benchmarkTest', Test) {
    group = 'verification'
    description = '예약 체결 순차/병렬 처리 벤치마크 실행 (실제 DB 사용, 시간이 걸림)'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'benchmark'
    }
    outputs.upToDateWhen { false } // 항상 재실행
    testLogging {
        showStandardStreams = true // 벤치마크 결과 로그를 콘솔에 바로 출력
        events "passed", "failed"
    }
}

// 예약 체결 레이스 컨디션 재현 테스트 전용 태스크 — ./gradlew concurrencyTest
tasks.register('concurrencyTest', Test) {
    group = 'verification'
    description = '예약 체결 동시성 결함(레이스 컨디션) 재현 테스트 실행 (실제 DB 사용, 시간이 걸림)'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'concurrency'
    }
    outputs.upToDateWhen { false } // 항상 재실행
    testLogging {
        showStandardStreams = true
        events "passed", "failed"
    }
}
