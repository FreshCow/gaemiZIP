# EC2 호스트 Nginx 리버스 프록시 설정 (참고용 원본 — 실제 적용은 EC2에서 certbot이 자동 수정)
# 적용 경로: /etc/nginx/sites-available/gaemizip → /etc/nginx/sites-enabled/gaemizip 심볼릭 링크
# YOUR_DOMAIN.duckdns.org 부분을 실제 DuckDNS 도메인으로 교체할 것

server {
    listen 80;
    server_name gaemizip.duckdns.org;

    # Spring 백엔드 REST API
    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Spring 백엔드 WebSocket
    location /ws {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Next.js 프론트엔드 (나머지 전부)
    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
